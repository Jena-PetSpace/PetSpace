# PetSpace 프로젝트 Codex 설정

# 샌드박스 밖 실행이나 권한 확대가 필요할 때 사용자 승인을 요청한다.
approval_policy = "on-request"

# 저장소 작업 영역 안에서만 쓰기를 허용한다.
sandbox_mode = "workspace-write"

[sandbox_workspace_write]
network_access = false

# 모델, reasoning, 개인 프로파일은 각 사용자의 ~/.codex/config.toml에서 관리한다.
# hooks와 추가 자동화는 현재 설치 버전의 공식 스키마 검증 후 도입한다.
