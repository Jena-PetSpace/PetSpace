  <circle cx="14" cy="119" r="3.5" fill="#F4C0D1"/>

  <!-- Sitting paws (bottom) -->
  <ellipse cx="48" cy="142" rx="11" ry="7" fill="#fff" stroke="#000" stroke-width="2.2"/>
  <circle cx="48" cy="142" r="4" fill="#F4C0D1"/>
  <ellipse cx="84" cy="142" rx="11" ry="7" fill="#fff" stroke="#000" stroke-width="2.2"/>
  <circle cx="84" cy="142" r="4" fill="#F4C0D1"/>
