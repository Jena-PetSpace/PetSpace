flutter_native_splash:

  # 네이티브 스플래시 배경 흰색 — 중앙에 앱 아이콘 캐릭터 표시
  color: "#FFFFFF"
  color_dark: "#FFFFFF"

  # 캐릭터 PNG - 구형 Android
  image: assets/icons/splash_char.png
  image_dark: assets/icons/splash_char.png

  # Android 12+ Splash Screen API
  # icon은 정확히 중앙에 배치됨 (1152x1152 안에 768x768 실제 이미지)
  android_12:
    color: "#FFFFFF"
    color_dark: "#FFFFFF"
    image: assets/icons/splash_char.png
    image_dark: assets/icons/splash_char.png
    icon_background_color: "#FFFFFF"
    icon_background_color_dark: "#FFFFFF"
    # branding 이미지 없음 - 중앙 아이콘만 표시

  android: true
  ios: true
  web: false
